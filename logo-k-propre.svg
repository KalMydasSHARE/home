<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Barre verticale navy, pointes en chevron -->
  <polygon points="24,16 40,16 40,84 24,84" fill="#1E3050"/>
  <polygon points="20,16 44,16 32,4"  fill="#274063"/>
  <polygon points="20,84 44,84 32,96" fill="#16283F"/>
  <line x1="32" y1="8" x2="32" y2="92" stroke="#3A5578" stroke-width="0.8" opacity="0.6"/>
  <!-- Diagonale 1 : pointe en bas de la barre, large en haut a droite -->
  <polygon points="30,88 70,9 79,15" fill="#E8C84A"/>
  <polygon points="30,88 79,15 86,23" fill="#D4AF37"/>
  <!-- Diagonale 2 : pointe au centre de la diagonale 1, vers le bas a droite -->
  <polygon points="54,52 79,92 84,84" fill="#C9A227"/>
  <polygon points="54,52 84,84 88,75" fill="#BEA056"/>
</svg>
